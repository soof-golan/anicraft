name: release

# Push a tag like v0.1.0 to build the app and the CLI on Linux and Windows (x86_64 and Arm64) and macOS (Apple silicon
# and Intel), and attach the packages plus SHA256SUMS to a GitHub pre-release. Each platform gets an archive and an
# installer: a .deb and an AppImage on Linux, a .dmg per architecture on macOS, a setup.exe (NSIS, Start-menu shortcuts,
# .fla/.xfl associations) on Windows. The binaries are unsigned (no signing secrets are used).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-14
            target: x86_64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: linux-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install rustup if the runner image lacks it
        # The Windows on Arm image does not ship rustup; the pinned toolchain then comes from rust-toolchain.toml.
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain none --profile minimal
            Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"
          }
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev libfontconfig1-dev \
            desktop-file-utils
      - run: rustup show
      - run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p anicraft -p anicraft-cli
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
          OS_KIND: ${{ runner.os }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then VERSION="dev"; fi
          PKG="anicraft-${VERSION}-${NAME}"
          BIN="target/${TARGET}/release"
          mkdir -p dist "stage/${PKG}"
          cp README.md LICENSE-MIT LICENSE-BSD-3-Clause "stage/${PKG}/"
          case "$OS_KIND" in
            Linux)
              cp "${BIN}/anicraft" "${BIN}/anicraft-cli" "stage/${PKG}/"
              tar -C stage -czf "dist/${PKG}.tar.gz" "${PKG}"
              ;;
            macOS)
              APP="stage/${PKG}/AniCraft.app"
              mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources"
              cp "${BIN}/anicraft" "${APP}/Contents/MacOS/anicraft"
              sed -e "s/@VERSION@/${VERSION}/g" packaging/macos/Info.plist > "${APP}/Contents/Info.plist"
              cp "${BIN}/anicraft-cli" "stage/${PKG}/"
              codesign --force --deep --sign - "${APP}" || true
              (cd stage && ditto -c -k --keepParent "${PKG}" "../dist/${PKG}.zip")
              ;;
            Windows)
              cp "${BIN}/anicraft.exe" "${BIN}/anicraft-cli.exe" "stage/${PKG}/"
              (cd stage && 7z a -tzip "../dist/${PKG}.zip" "${PKG}")
              ;;
          esac
          printf 'PKG=%s\nVERSION=%s\n' "${PKG}" "${VERSION}" >> "$GITHUB_ENV"
          ls -l dist
      - name: Installer (Linux .deb and AppImage)
        if: runner.os == 'Linux'
        run: bash packaging/linux/build-linux-packages.sh anicraft "${VERSION}" "stage/${PKG}" dist
      - name: Installer (macOS .dmg)
        if: runner.os == 'macOS'
        run: bash packaging/macos/build-dmg.sh AniCraft "stage/${PKG}" "dist/${PKG}.dmg"
      - name: Installer (Windows setup.exe)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Portable NSIS (x86 build; runs on x64 and, emulated, on Arm64), pinned by SHA-256. No installer or choco needed.
          NSIS_VERSION=3.11
          NSIS_SHA256=c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1
          NSIS_DIR="$RUNNER_TEMP/nsis"
          mkdir -p "$NSIS_DIR"
          curl -fsSL --retry 5 --retry-delay 5 -o "$NSIS_DIR/nsis.zip" "https://downloads.sourceforge.net/project/nsis/NSIS%203/${NSIS_VERSION}/nsis-${NSIS_VERSION}.zip"
          echo "${NSIS_SHA256}  $NSIS_DIR/nsis.zip" | sha256sum -c -
          7z x -y "$NSIS_DIR/nsis.zip" "-o$NSIS_DIR" > /dev/null
          # makensis resolves relative paths from the .nsi's directory, so pass absolute Windows paths.
          mkdir -p dist
          STAGE_WIN="$(cygpath -w "$PWD/stage/${PKG}")"
          OUTFILE_WIN="$(cygpath -w "$PWD/dist/${PKG}-setup.exe")"
          MSYS2_ARG_CONV_EXCL='*' "$NSIS_DIR/nsis-${NSIS_VERSION}/makensis.exe" -V2 "-DVERSION=${VERSION}" "-DSTAGE=${STAGE_WIN}" "-DOUTFILE=${OUTFILE_WIN}" packaging/windows/anicraft.nsi
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: package-*
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'EOF'
          AniCraft ${{ github.ref_name }}: an Animate-compatible 2D animation editor (XFL/FLA, SWF, GIF and MP4 export).

          These binaries are unsigned. On macOS, right-click the app and choose Open the first time (or run
          `xattr -dr com.apple.quarantine AniCraft.app`). On Windows, SmartScreen may warn: choose More info, then Run
          anyway. Verify downloads against SHA256SUMS.
          EOF
          gh release create "${{ github.ref_name }}" dist/* --prerelease --title "AniCraft ${{ github.ref_name }}" --notes-file notes.md
