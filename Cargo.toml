[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR BSD-3-Clause"
rust-version = "1.99"
repository = "https://github.com/soof-golan/anicraft"

[workspace.dependencies]
# Engine crates from anicraft-libs (see its ARCHITECTURE.md for what each one owns), pinned to the v0.1.0 commit.
# To move to newer engine work, change every rev below to the new commit and run `cargo update`.
anim-core = { git = "https://github.com/soof-golan/anicraft-libs", rev = "7d7f52b64d4c9958fe864dbbc4af0409c7a65fea" }
anim-display = { git = "https://github.com/soof-golan/anicraft-libs", rev = "7d7f52b64d4c9958fe864dbbc4af0409c7a65fea" }
anim-archive = { git = "https://github.com/soof-golan/anicraft-libs", rev = "7d7f52b64d4c9958fe864dbbc4af0409c7a65fea" }
anim-shape = { git = "https://github.com/soof-golan/anicraft-libs", rev = "7d7f52b64d4c9958fe864dbbc4af0409c7a65fea" }
anim-scene = { git = "https://github.com/soof-golan/anicraft-libs", rev = "7d7f52b64d4c9958fe864dbbc4af0409c7a65fea" }
anim-morph = { git = "https://github.com/soof-golan/anicraft-libs", rev = "7d7f52b64d4c9958fe864dbbc4af0409c7a65fea" }
anim-text = { git = "https://github.com/soof-golan/anicraft-libs", rev = "7d7f52b64d4c9958fe864dbbc4af0409c7a65fea" }
anim-timeline = { git = "https://github.com/soof-golan/anicraft-libs", rev = "7d7f52b64d4c9958fe864dbbc4af0409c7a65fea" }
anim-rig = { git = "https://github.com/soof-golan/anicraft-libs", rev = "7d7f52b64d4c9958fe864dbbc4af0409c7a65fea" }
anim-render = { git = "https://github.com/soof-golan/anicraft-libs", rev = "7d7f52b64d4c9958fe864dbbc4af0409c7a65fea" }
anim-audio = { git = "https://github.com/soof-golan/anicraft-libs", rev = "7d7f52b64d4c9958fe864dbbc4af0409c7a65fea" }
anim-artwork = { git = "https://github.com/soof-golan/anicraft-libs", rev = "7d7f52b64d4c9958fe864dbbc4af0409c7a65fea" }
anim-export = { git = "https://github.com/soof-golan/anicraft-libs", rev = "7d7f52b64d4c9958fe864dbbc4af0409c7a65fea" }
anim-video = { git = "https://github.com/soof-golan/anicraft-libs", rev = "7d7f52b64d4c9958fe864dbbc4af0409c7a65fea" }
anim-ui = { git = "https://github.com/soof-golan/anicraft-libs", rev = "7d7f52b64d4c9958fe864dbbc4af0409c7a65fea" }
anim-session = { git = "https://github.com/soof-golan/anicraft-libs", rev = "7d7f52b64d4c9958fe864dbbc4af0409c7a65fea" }
anim-mcp = { git = "https://github.com/soof-golan/anicraft-libs", rev = "7d7f52b64d4c9958fe864dbbc4af0409c7a65fea" }
anim-script = { git = "https://github.com/soof-golan/anicraft-libs", rev = "7d7f52b64d4c9958fe864dbbc4af0409c7a65fea" }
anim-testkit = { git = "https://github.com/soof-golan/anicraft-libs", rev = "7d7f52b64d4c9958fe864dbbc4af0409c7a65fea" }

# Crates of this repository.
anicraft-xfl = { path = "crates/xfl" }
anicraft-swf = { path = "crates/swf" }
anicraft-tools = { path = "crates/tools" }
anicraft-cli = { path = "apps/anicraft-cli" }

# Craft crates, pinned by rev like the Craft apps do.
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "8f5a2831614e632f91ad367f7af2a6e5b61b9529" }
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "8f5a2831614e632f91ad367f7af2a6e5b61b9529" }
# VectorCraft's path booleans, planar faces (Live Paint) and curve fitting, used by the drawing tools.
vectorcraft-geom = { git = "https://github.com/storytold/vectorcraft", rev = "ed96a1219620b5b6ab13e25369f7b55cddd664f6" }
vectorcraft-pathops = { git = "https://github.com/storytold/vectorcraft", rev = "ed96a1219620b5b6ab13e25369f7b55cddd664f6" }
vectorcraft-trace = { git = "https://github.com/storytold/vectorcraft", rev = "ed96a1219620b5b6ab13e25369f7b55cddd664f6" }

# External crates (versions match anicraft-libs where they overlap).
kurbo = { version = "0.13", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
thiserror = "2"
color-eyre = "0.6"
clap = { version = "4", features = ["derive"] }
rayon = "1.11"
crossbeam-channel = "0.5"
rustc-hash = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"
egui = "0.36.2"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
proptest = "1"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
# Ruffle's SWF reader/writer (MIT OR Apache-2.0). Used only in tests, to read our own output back.
swf = "0.3"
# Read-only XML tree (no unsafe, no DTD, node limit); gives byte ranges so unknown elements are kept verbatim.
roxmltree = "0.21"

# The PDF stack of anim-artwork (AI import) needs the vendored hayro/krilla of craft-libs; same patch as anicraft-libs.
[patch.crates-io]
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "ca50d63b773c99f96e75c77ce5a1d21e7c9cda0d" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "ca50d63b773c99f96e75c77ce5a1d21e7c9cda0d" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "ca50d63b773c99f96e75c77ce5a1d21e7c9cda0d" }
krilla = { git = "https://github.com/storytold/craft-libs", rev = "ca50d63b773c99f96e75c77ce5a1d21e7c9cda0d" }

[workspace.lints.rust]
unsafe_code = "forbid"

# namtao.com/rust strict lints: teach Rust and prevent runtime panics.
[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
dbg_macro = "deny"

# Dev profile for everything except benchmarks (Craft convention: optimised deps, fast incremental builds).
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
