# cargo-nextest settings (CI runs `mbx nextest run`; `mbx test` still works locally). Nextest runs every test in its own
# process and spreads them over all test binaries at once, so the few seconds of actual testing never wait on a link.

[profile.default]
# One stuck test must not hold the job for the 45 minute job limit.
slow-timeout = { period = "60s", terminate-after = 5 }
