[package]
name = "anicraft-swf"
description = "SWF writer: header, bit-packed records, shapes with gradient and bitmap fills, sprites, sounds, and an exporter from display lists"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anim-core = { workspace = true }
anim-display = { workspace = true }
anim-shape = { workspace = true }
flate2 = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[[bench]]
name = "swf"
harness = false

[dev-dependencies]
# The benchmarks evaluate frames of the sample files into display lists.
anicraft-xfl = { workspace = true }
anim-timeline = { workspace = true }
criterion = { version = "0.8", default-features = false }
# The visual tests render the same display lists with anim-render and compare with Ruffle's picture of the SWF.
anim-render = { workspace = true }
png = { workspace = true }
proptest = { workspace = true }
# The sample-gated tests (tests/samples.rs) read library XML out of the FLA zips.
roxmltree = { workspace = true }
serde_json = { workspace = true }
swf = { workspace = true }
