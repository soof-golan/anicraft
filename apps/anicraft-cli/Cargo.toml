[package]
name = "anicraft-cli"
description = "Headless AniCraft: inspect, render, export and convert Animate documents, and serve them over MCP"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "anicraft_cli"

[[bin]]
name = "anicraft-cli"
path = "src/main.rs"

[dependencies]
anicraft-swf = { workspace = true }
anicraft-tools = { workspace = true }
anicraft-xfl = { workspace = true }
anim-artwork = { workspace = true }
anim-audio = { workspace = true }
anim-core = { workspace = true }
anim-display = { workspace = true }
anim-export = { workspace = true }
anim-mcp = { workspace = true }
anim-render = { workspace = true }
anim-scene = { workspace = true }
anim-session = { workspace = true }
anim-shape = { workspace = true }
anim-timeline = { workspace = true }
anim-video = { workspace = true }
clap = { workspace = true }
color-eyre = { workspace = true }
regex = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[[bench]]
name = "render"
harness = false

[dev-dependencies]
anim-shape = { workspace = true }
base64 = "0.22"
criterion = { version = "0.8", default-features = false }
png = { workspace = true }
tempfile = "3"
