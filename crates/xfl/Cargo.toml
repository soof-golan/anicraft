[package]
name = "anicraft-xfl"
description = "XFL folder / zipped FLA reader: maps Animate documents onto the anim-scene model, with media decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anim-archive = { workspace = true }
anim-core = { workspace = true }
anim-display = { workspace = true }
anim-scene = { workspace = true }
anim-shape = { workspace = true }
flate2 = { workspace = true }
# JPEG (photo bitmaps) and PNG decoding with allocation limits.
image = { workspace = true, features = ["jpeg"] }
rayon = { workspace = true }
roxmltree = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[[bench]]
name = "xfl"
harness = false

[dev-dependencies]
# Only the `render_frame` example uses the rasteriser, to look at what the reader produced.
anim-render = { workspace = true }
criterion = { version = "0.8", default-features = false }
anim-testkit = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
