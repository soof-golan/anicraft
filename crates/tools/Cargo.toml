[package]
name = "anicraft-tools"
description = "AniCraft editing tools as pure state machines: pointer and key events in, document commands and overlay primitives out"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anim-core = { workspace = true }
anim-scene = { workspace = true }
anim-shape = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Grapheme-aware backspace and delete in the text tool (right-to-left and combining marks).
unicode-segmentation = "1.13"
vectorcraft-geom = { workspace = true }
vectorcraft-pathops = { workspace = true }

[dev-dependencies]
# The demo example renders tool results to a PNG.
anim-display = { workspace = true }
anim-render = { workspace = true }
png = { workspace = true }
proptest = { workspace = true }
