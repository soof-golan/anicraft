[package]
name = "anicraft-xfl"
description = "XFL folder / zipped FLA reader: maps Animate documents onto the anim-scene model, with media decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anim-archive = { workspace = true }
anim-core = { workspace = true }
anim-display = { workspace = true }
anim-scene = { workspace = true }
anim-shape = { workspace = true }
flate2 = { workspace = true }
# JPEG (photo bitmaps) and PNG decoding with allocation limits.
image = { workspace = true, features = ["jpeg"] }
roxmltree = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
png = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"
